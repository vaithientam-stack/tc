<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TC Thiện Tâm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TC Thiện Tâm">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b3d6e; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #bao { display: none; color: #fff; font: 16px -apple-system, sans-serif; padding: 40px 24px; text-align: center; }
</style>
</head>
<body>
<div id="bao">Chưa có mã mở app.<br>Mở trang bằng đường link riêng có phần sau dấu #.</div>
<script>
  // KHÔNG chứa khoá / link riêng. Link app lấy từ phần sau dấu # (không gửi lên máy chủ GitHub):
  //   https://<tên>.github.io/tc/#<phần sau "/macros/s/" của link app, vd AKfy...xyz/exec?k=...>
  // Chỉ nhận đúng dạng <mã triển khai>/exec[?...] trên script.google.com -> không nhúng được trang nào khác.
  (function () {
    var h = decodeURIComponent((location.hash || "").slice(1));
    if (!/^[A-Za-z0-9_-]{20,}\/exec(\?[^#\s]*)?$/.test(h)) { document.getElementById("bao").style.display = "block"; return; }
    var f = document.createElement("iframe");
    f.src = "https://script.google.com/macros/s/" + h;
    f.allow = "clipboard-write";
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
